<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D经理 · 看板入口</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: linear-gradient(160deg,#0d1117,#1a2332); color: #e6edf3; }
  .card { width: min(92vw, 560px); background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12);
          border-radius: 20px; padding: 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; letter-spacing: .5px; }
  .sub { color: #8b95a0; font-size: 13px; margin-bottom: 24px; }
  .label { font-size: 12px; color: #8b95a0; margin-bottom: 8px; letter-spacing: .5px; }
  .url { word-break: break-all; font-family: ui-monospace, Consolas, monospace; font-size: 14px;
         background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
         padding: 12px 14px; color: #7ee787; margin-bottom: 18px; }
  .btn { display: block; text-align: center; text-decoration: none; font-weight: 600; font-size: 17px;
         padding: 16px; border-radius: 12px; background: #238636; color: #fff; letter-spacing: 1px; }
  .btn:active { background: #1f7a31; }
  .meta { margin-top: 18px; font-size: 12px; color: #6e7681; line-height: 1.7; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #7ee787;
         margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
  <div class="card">
    <h1>D经理 · 看板入口</h1>
    <div class="sub">这个地址永远不变；后台换地址会自动更新，你只管点下面的按钮。</div>

    <div class="label">当前看板地址</div>
    <div class="url" id="url">加载中…</div>

    <a class="btn" id="go" href="#" target="_blank" rel="noopener">打开看板 →</a>

    <div class="meta">
      <div><span class="dot"></span>最后更新：<span id="ts">—</span></div>
      <div>如果打不开：等 2 分钟刷新本页，后台会自动修复隧道并更新地址。</div>
    </div>
  </div>

<script>
(async function () {
  const urlEl = document.getElementById('url');
  const go = document.getElementById('go');
  const ts = document.getElementById('ts');
  function show(u, t) {
    urlEl.textContent = u || '（暂未获取到地址）';
    if (u) go.href = u;
    ts.textContent = t || new Date().toLocaleString('zh-CN', { hour12: false });
  }
  try {
    const r = await fetch('./url.json?t=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    show(j.url, j.updated_bj);
  } catch (e) {
    // 兜底：url.json 读不到时直接显示静态链接（publish_board 会写死一个 fallback）
    show(window.__FALLBACK_URL__, null);
  }
})();
</script>
</body>
</html>
